# Nginx menyajikan frontend React dan meneruskan /api ke container backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy ke backend; "backend" adalah nama service di docker-compose (DNS internal Docker)
    location /api/ {
        # DNS internal Docker dengan variabel: alamat backend dicari ulang saat container backend diganti (redeploy)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Endpoint untuk HEALTHCHECK container frontend
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single Page Application: semua path lain diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache file statis hasil build (nama file sudah mengandung hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
