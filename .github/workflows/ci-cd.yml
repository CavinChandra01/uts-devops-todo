# Pipeline CI/CD aplikasi Daftar Tugas
#
#   CI  (setiap push & pull request):
#       1. Lint (ESLint) + unit test backend & frontend
#       2. Build semua image Docker + integration test stack lengkap (frontend + backend + MySQL)
#   CD  (hanya push ke branch main):
#       3. Build & push image ke Docker Hub (tag: latest dan commit SHA)
#       4. Deploy otomatis ke server (self-hosted runner) dengan docker compose
#
# Yang perlu disiapkan di GitHub (Settings -> Secrets and variables -> Actions):
#   Variables : DOCKERHUB_USERNAME
#   Secrets   : DOCKERHUB_TOKEN, DB_PASSWORD, DB_ROOT_PASSWORD

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: "CI 1 - Lint & unit test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Lint & test backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Lint, test & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  integration-test:
    name: "CI 2 - Build image & integration test"
    needs: unit-test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-password
      DB_ROOT_PASSWORD: ci-root-password
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build semua image
        run: docker compose build

      - name: Jalankan stack (tunggu sampai semua container healthy)
        run: docker compose up -d --wait --wait-timeout 240

      - name: Status container
        run: docker compose ps

      - name: Smoke test end-to-end
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Log container (jika gagal)
        if: failure()
        run: docker compose logs --no-color

      - name: Hentikan stack
        if: always()
        run: docker compose down -v

  build-and-push:
    name: "CD 1 - Push image ke Docker Hub"
    needs: integration-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ambil 7 karakter commit SHA sebagai versi
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          build-args: APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/uts-todo-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/uts-todo-backend:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: APP_VERSION=${{ env.SHORT_SHA }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/uts-todo-frontend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/uts-todo-frontend:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: "CD 2 - Deploy ke server"
    needs: build-and-push
    runs-on: self-hosted
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
      TAG: latest
      APP_PORT: 8080
    steps:
      - uses: actions/checkout@v7

      - name: Tarik image terbaru dari Docker Hub
        run: docker compose pull backend frontend

      - name: Jalankan ulang container dengan image baru
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - name: Status container setelah deploy
        run: docker compose ps

      - name: Bersihkan image lama
        run: docker image prune -f
